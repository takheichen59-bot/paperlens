[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-extraction-contracts"
version = "0.3.0"
description = "Evidence-linked scientific literature acquisition and research workspace"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "httpx>=0.27,<1", "feedparser>=6,<7", "PyMuPDF>=1.24,<2", "typer>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storage = ["schema.sql", "migrations/*.sql", "migrations/README.md"]
extractors = ["*.json"]
paper_platform = ["web_assets/*"]
science_platform = ["schema.sql", "migrations/*.sql", "venues.json", "web/*"]

[project.scripts]
paperlens = "paper_platform.cli:app"
paperlens-web = "paper_platform.web:main"
paperlens-research = "research.__main__:main"
paperlens-platform = "science_platform.__main__:main"

[project.optional-dependencies]
platform = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]
