name: Offline engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install '.[platform,test]'
      - run: python scripts/verify_all.py
      - run: python -m unittest discover -s tests/master -v
      - run: python acceptance/master_a_integrity.py
      - run: python acceptance/research_science.py && python acceptance/research_intelligence.py
      - run: python scripts/master_recovery.py
      - run: python scripts/check_repository_secrets.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node verify-site.mjs && node verify-research.mjs && node verify-master-a.mjs
        working-directory: website
      - run: node verify-hosted-attribution.mjs && node verify-hosted-exports.mjs && node verify-workspace.mjs && node build-workspace.mjs
        working-directory: website
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[platform,browser]'
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/browser/run_workflow.py --output work/browser-ci
      - run: python tests/browser/run_hosted_workspace.py --output work/hosted-browser-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-workflow-evidence
          path: |
            work/browser-ci/report.json
            work/browser-ci/*.png
            work/browser-ci/server.log
            work/hosted-browser-ci/report.json
            work/hosted-browser-ci/*.png
            work/hosted-browser-ci/*.jsonl
            work/hosted-browser-ci/*.xlsx
            work/hosted-browser-ci/*.pdf
            work/hosted-browser-ci/server.log
# This workflow validates synthetic engineering/browser fixtures, not real LLMs,
# publisher permissions, scientific gold, Windows or 5,000 real PDFs.
